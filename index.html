<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>רשימת קניות</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>רשימת קניות <span id="sync-status" class="sync-status"></span></h1>
    <nav class="tabs">
      <button class="tab active" data-tab="list">הרשימה שלי <span id="badge" class="badge hidden">0</span></button>
      <button class="tab" data-tab="template">תבנית שבועית</button>
    </nav>
  </header>

  <main>
    <!-- View 1: Shopping List -->
    <section id="list-view" class="view active">
      <div id="empty-state">
        <p>הרשימה ריקה</p>
        <p>לחצו על + כדי להוסיף מוצרים</p>
      </div>
      <ul id="shopping-list"></ul>
      <div id="list-actions" class="list-actions hidden">
        <button id="clear-purchased" class="btn-secondary">מחק מסומנים</button>
        <button id="clear-all" class="btn-danger">נקה הכל</button>
      </div>
    </section>

    <!-- View 2: Template -->
    <section id="template-view" class="view">
      <div id="template-empty-state">
        <p>התבנית ריקה</p>
        <p>הוסיפו מוצרים כדי ליצור תבנית שבועית</p>
      </div>
      <ul id="template-list"></ul>
      <div id="template-actions" class="template-actions">
        <button id="add-to-template-btn" class="btn-secondary">+ הוסף מוצר לתבנית</button>
        <button id="add-all-template" class="btn-primary hidden">הוסף הכל לרשימה</button>
      </div>
    </section>

    <!-- View 3: Add Products -->
    <section id="add-view" class="view">
      <div id="suggested-section" class="suggested-section">
        <h3 class="suggested-title">מוצרים נפוצים</h3>
        <div id="suggested-items" class="suggested-items"></div>
      </div>
      <input type="search" id="search-input" placeholder="חיפוש מוצר...">
      <button id="add-custom-btn" class="btn-custom">+ הוסף מוצר מותאם אישית</button>
      <div id="custom-form" class="custom-form hidden">
        <input type="text" id="custom-name" placeholder="שם המוצר...">
        <select id="custom-category"></select>
        <button id="custom-submit" class="btn-primary">הוסף</button>
      </div>
      <div id="catalog"></div>
    </section>
  </main>

  <!-- Edit Product Modal -->
  <div id="edit-modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h3>עריכת מוצר</h3>
      <div class="edit-form">
        <label>שם המוצר</label>
        <input type="text" id="edit-name" placeholder="שם המוצר">
        <label>קטגוריה</label>
        <select id="edit-category"></select>
        <label>יחידת ברירת מחדל</label>
        <div class="unit-toggle">
          <button class="edit-unit-btn active" data-unit="units">יחידות</button>
          <button class="edit-unit-btn" data-unit="kg">ק"ג</button>
        </div>
      </div>
      <div class="modal-actions">
        <button id="edit-save" class="btn-primary">שמור</button>
        <button id="edit-cancel" class="btn-secondary">ביטול</button>
      </div>
    </div>
  </div>

  <!-- Amount Selection Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="modal-product-name"></h3>
      <div class="unit-toggle">
        <button class="unit-btn active" data-unit="units">יחידות</button>
        <button class="unit-btn" data-unit="kg">ק"ג</button>
      </div>
      <div class="amount-control">
        <button id="amount-minus" class="amount-btn">-</button>
        <input type="number" id="amount-input" value="1" min="0.1" step="1">
        <button id="amount-plus" class="amount-btn">+</button>
      </div>
      <div class="modal-actions">
        <button id="modal-confirm" class="btn-primary">הוסף לרשימה</button>
        <button id="modal-cancel" class="btn-secondary">ביטול</button>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <button id="fab-add" class="fab" aria-label="הוסף מוצר">+</button>

  <!-- Bottom Sheet -->
  <div id="sheet-overlay" class="sheet-overlay hidden">
    <div id="bottom-sheet" class="bottom-sheet">
      <div class="sheet-handle-bar"></div>
      <div class="sheet-header">
        <h2 id="sheet-title" class="sheet-title">הוספת מוצרים</h2>
        <button id="sheet-close" class="sheet-close" aria-label="סגור">✕</button>
      </div>
      <div class="sheet-body">
        <!-- Template section -->
        <div id="sheet-template-section" class="sheet-template-section">
          <button id="sheet-template-toggle" class="sheet-template-toggle">
            <span>תבנית שבועית</span>
            <span id="sheet-template-chevron" class="sheet-chevron">▼</span>
          </button>
          <div id="sheet-template-content" class="sheet-template-content hidden">
            <div id="sheet-template-empty" class="sheet-template-empty hidden"><p>התבנית ריקה</p></div>
            <ul id="sheet-template-list" class="sheet-template-list"></ul>
            <button id="sheet-add-all-template" class="btn-primary sheet-add-all hidden">הוסף הכל לרשימה</button>
          </div>
        </div>

        <!-- Suggested -->
        <div class="suggested-section">
          <h3 class="suggested-title">מוצרים נפוצים</h3>
          <div id="sheet-suggested-items" class="suggested-items"></div>
        </div>

        <!-- Search -->
        <input type="search" id="sheet-search-input" placeholder="חיפוש מוצר..." class="sheet-search">

        <!-- Custom item -->
        <button id="sheet-add-custom-btn" class="btn-custom">+ הוסף מוצר מותאם אישית</button>
        <div id="sheet-custom-form" class="custom-form hidden">
          <input type="text" id="sheet-custom-name" placeholder="שם המוצר...">
          <select id="sheet-custom-category"></select>
          <button id="sheet-custom-submit" class="btn-primary">הוסף</button>
        </div>

        <!-- Catalog -->
        <div id="sheet-catalog"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
